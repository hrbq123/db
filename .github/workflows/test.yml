name: Sync from

on:
  schedule:
    - cron: '30 19 * * *'  # 每天北京时间 3:30 执行
    - cron: '30 23 * * *'
  workflow_dispatch:      # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # 获取全部历史

      - name: Set up Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # 配置默认编辑器为cat，避免需要交互
          git config --global core.editor "cat"

      - name: Sync from upstream
        id: sync
        run: |
          # 确保 upstream 存在
          git remote remove upstream || true
          git remote add upstream https://github.com/LmeSzinc/AzurLaneAutoScript.git
          
          # 拉取最新代码
          git fetch upstream
          git checkout --track origin/db || git checkout db
          
          # 尝试合并，捕获失败状态
          if git merge --no-edit upstream/master; then
            echo "合并成功，无冲突"
            echo "conflict=false" >> $GITHUB_OUTPUT
          else
            echo "检测到冲突，尝试自动解决..."
            echo "conflict=true" >> $GITHUB_OUTPUT
            
            # 1. 获取所有冲突文件列表
            conflict_files=$(git diff --name-only --diff-filter=U)
            
            # 2. 分类处理冲突文件
            for file in $conflict_files; do
              # 检查文件是否为二进制
              if file --mime-type -b "$file" | grep -q '^image/\|^application/'; then
                echo "二进制文件冲突: $file，选择上游版本"
                git checkout --theirs "$file"  # 选上游版本，如需本地版本用--ours
                git add "$file"
              else
                echo "文本文件冲突: $file，尝试自动合并"
                # 尝试用上游版本覆盖（可根据需求改为--ours保留本地）
                git checkout --theirs "$file"
                git add "$file"
              fi
            done
            
            # 3. 尝试完成合并（指定提交信息，避免编辑器交互）
            if ! git commit -m "自动解决冲突：合并 upstream/master 到 db 分支"; then
              echo "自动解决失败，仍有未处理冲突"
              echo "conflict_files=$conflict_files" >> $GITHUB_OUTPUT
              exit 1
            fi
          fi
          
          # 4. 推送更改（仅当有新内容时）
          if git log origin/db..db --oneline; then
            git push origin db
            echo "推送成功"
          else
            echo "无新内容需要推送"
          fi

      - name: 冲突通知
        if: steps.sync.outputs.conflict == 'true' && failure()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔄 同步上游代码时出现无法自动解决的冲突',
              body: `自动同步上游代码时检测到无法解决的冲突文件：\n${steps.sync.outputs.conflict_files}\n请手动处理后重新运行工作流。`
            })
