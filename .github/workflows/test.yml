name: test

on:
  schedule:
    - cron: '30 19 * * *'  # 每天北京时间 3:30 执行
    - cron: '30 23 * * *'
  workflow_dispatch:      # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # 获取全部历史

      - name: Set up Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Sync from upstream
        run: |
          # 确保 upstream 存在
          git remote remove upstream || true
          git remote add upstream https://github.com/LmeSzinc/AzurLaneAutoScript.git
          
          # 拉取最新代码
          git fetch upstream
          git checkout --track origin/db || git checkout db
          
          # 尝试合并
          if ! git merge --no-edit upstream/master; then
            echo "合并冲突，尝试自动解决..."
            
            # 处理二进制文件冲突 - 这里选择保留上游版本
            # 如果你想保留本地版本，将--theirs改为--ours
            git checkout --theirs assets/shop/general/BoxSardegnaT2.png
            git add assets/shop/general/BoxSardegnaT2.png
            
            # 处理其他可能的文本冲突
            # 对于文本文件，可以尝试使用合并工具或手动解决
            # 这里我们假设其他冲突可以自动解决或忽略
            git merge --continue || true
          fi
          
          # 推送更改（只有在有新内容时才推送）
          if git log origin/db..db; then
            git push origin db
          else
            echo "没有需要推送的更改"
          fi
