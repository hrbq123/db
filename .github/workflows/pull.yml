name: Sync from Upstream

on:
  schedule:
    - cron: '30 19 * * *'  # 每天北京时间 3:30 执行
    - cron: '30 23 * * *'
  workflow_dispatch:      # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 显式声明需要写入代码的权限
      workflows: write # 显式声明需要修改工作流的权限
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4  # 升级到v4版本（更稳定）
        with:
          fetch-depth: 0  # 获取全部历史
          token: ${{ secrets.SYNC_PAT }}  # 使用自定义PAT而非默认令牌

      - name: Set up Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Sync from upstream
        run: |
          # 确保 upstream 存在
          git remote remove upstream || true
          git remote add upstream https://github.com/hrbq123/Alas-with-Dashboard.git
          
          # 拉取最新代码
          git fetch upstream
          git checkout --track origin/db || git checkout db
          
          # 尝试合并（冲突时自动中止，避免工作流失败）
          git merge --no-edit upstream/master || {
            echo "合并出现冲突，终止同步"
            exit 1
          }
          
          # 推送更改（使用自定义PAT的凭据）
          git push https://x-access-token:${{ secrets.SYNC_PAT }}@github.com/hrbq123/db.git db
